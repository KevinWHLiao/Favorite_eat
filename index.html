<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorite Eat · 雙人餐桌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>

  <!-- Onboarding -->
  <section id="onboarding" class="screen hidden">
    <div class="onboard-card">
      <p class="brand-mark">Favorite Eat</p>
      <h1>雙人餐桌</h1>
      <p class="lead">把每一次一起吃飯，蓋成一本屬於你們的美食印章手帳。</p>
      <form id="onboard-form" class="stack">
        <label>
          你們怎麼叫對方？
          <div class="name-row">
            <input type="text" id="name-a" placeholder="小A" maxlength="12" required />
            <span class="amp">&</span>
            <input type="text" id="name-b" placeholder="小B" maxlength="12" required />
          </div>
        </label>
        <button type="submit" class="btn primary">開始我們的餐桌</button>
      </form>
    </div>
  </section>

  <!-- App shell -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Favorite Eat</span>
        <span class="couple-names" id="couple-names"></span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-view="home" type="button">手帳</button>
        <button class="tab" data-view="album" type="button">印章</button>
        <button class="tab" data-view="roulette" type="button">轉盤</button>
        <button class="tab" data-view="badges" type="button">成就</button>
      </nav>
    </header>

    <main>
      <!-- HOME -->
      <section id="view-home" class="view active">
        <div class="hero-panel">
          <div class="hero-copy">
            <p class="eyebrow">今晚的餐桌故事</p>
            <h2 id="home-greeting">又一起吃了一頓飯</h2>
            <p class="sub" id="home-stats">還沒有紀錄，先蓋下第一枚印章吧。</p>
          </div>
          <button class="btn primary" id="btn-open-add" type="button">＋ 新增回憶</button>
        </div>

        <div class="stat-rail" id="stat-rail"></div>

        <div class="section-head">
          <h3>最近的印章</h3>
          <button class="linkish" data-view="album" type="button">看全部</button>
        </div>
        <div class="stamp-row" id="recent-stamps"></div>
      </section>

      <!-- ALBUM -->
      <section id="view-album" class="view">
        <div class="section-head">
          <h3>美食印章冊</h3>
          <div class="filters">
            <select id="filter-cuisine">
              <option value="all">全部料理</option>
            </select>
            <select id="filter-sort">
              <option value="newest">最新優先</option>
              <option value="rating">評分最高</option>
              <option value="name">店名 A→Z</option>
            </select>
          </div>
        </div>
        <div class="album-grid" id="album-grid"></div>
        <p class="empty hidden" id="album-empty">還沒有印章。去吃一頓，再回來蓋章吧。</p>
      </section>

      <!-- ROULETTE -->
      <section id="view-roulette" class="view">
        <div class="roulette-wrap">
          <p class="eyebrow">猶豫症急救站</p>
          <h2>今天吃哪一間？</h2>
          <p class="sub">從你們蓋過章的店裡隨機抽一間，結束選擇障礙。</p>
          <div class="wheel-stage">
            <div class="wheel-glow"></div>
            <div id="wheel-result" class="wheel-result">
              <span class="wheel-placeholder">按下轉盤</span>
            </div>
          </div>
          <div class="roulette-actions">
            <button class="btn primary" id="btn-spin" type="button">轉動轉盤</button>
            <label class="check">
              <input type="checkbox" id="spin-favorites" />
              只抽 4 星以上
            </label>
          </div>
        </div>
      </section>

      <!-- BADGES -->
      <section id="view-badges" class="view">
        <div class="section-head">
          <h3>雙人成就</h3>
        </div>
        <div class="badge-grid" id="badge-grid"></div>
      </section>
    </main>

    <footer class="foot">
      <button class="ghost" id="btn-export" type="button">匯出資料</button>
      <label class="ghost as-btn">
        匯入資料
        <input type="file" id="btn-import" accept="application/json" hidden />
      </label>
      <button class="ghost" id="btn-reset-names" type="button">改暱稱</button>
    </footer>
  </div>

  <!-- Add / Edit modal -->
  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form" class="modal">
      <header>
        <h2 id="edit-title">新增回憶</h2>
        <button type="button" class="icon-close" id="btn-close-edit" aria-label="關閉">×</button>
      </header>
      <div class="modal-body stack">
        <label>
          餐廳名稱
          <input type="text" id="f-name" required maxlength="40" placeholder="例如：巷口那家拉麵" />
        </label>
        <div class="two-col">
          <label>
            料理類型
            <select id="f-cuisine" required></select>
          </label>
          <label>
            一起去的日期
            <input type="date" id="f-date" required />
          </label>
        </div>
        <div class="field">
          <span class="field-label">雙人評分</span>
          <div class="stars" id="star-picker" role="radiogroup" aria-label="評分"></div>
          <input type="hidden" id="f-rating" value="5" />
        </div>
        <div class="field">
          <span class="field-label">心情標籤</span>
          <div class="chip-row" id="mood-picker"></div>
        </div>
        <label>
          這餐的小故事
          <textarea id="f-note" rows="3" maxlength="280" placeholder="今天點了什麼？有什麼好笑的事？"></textarea>
        </label>
        <label class="check">
          <input type="checkbox" id="f-wishlist" />
          這是想去清單（還沒吃過）
        </label>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn danger ghost hidden" id="btn-delete">刪除</button>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" id="btn-cancel-edit">取消</button>
        <button type="submit" class="btn primary">蓋章保存</button>
      </footer>
    </form>
  </dialog>

  <!-- Detail modal -->
  <dialog id="detail-dialog">
    <div class="modal detail">
      <header>
        <h2 id="d-name"></h2>
        <button type="button" class="icon-close" id="btn-close-detail" aria-label="關閉">×</button>
      </header>
      <div class="modal-body" id="detail-body"></div>
      <footer class="modal-foot">
        <button type="button" class="btn ghost" id="btn-edit-from-detail">編輯</button>
        <button type="button" class="btn primary" id="btn-close-detail-2">好的</button>
      </footer>
    </div>
  </dialog>

  <!-- Toast / stamp animation -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="stamp-fx" class="stamp-fx" aria-hidden="true">
    <div class="stamp-seal">蓋章！</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
